<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { background: #F6F7F2; font-family: 'Manrope', system-ui, sans-serif; color: #0A1830; margin: 0; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Sora', system-ui, sans-serif; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(20, 42, 90, 0.15); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(20, 42, 90, 0.3); }
  
  .gradient-text { background: linear-gradient(135deg, #142A5A 0%, #5BB749 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  
  @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fade-up 0.4s ease forwards; opacity: 0; }
  .stagger-1 { animation-delay: 0.05s; } .stagger-2 { animation-delay: 0.1s; }
  .stagger-3 { animation-delay: 0.15s; } .stagger-4 { animation-delay: 0.2s; }
  .stagger-5 { animation-delay: 0.25s; } .stagger-6 { animation-delay: 0.3s; }
  
  @keyframes gps-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(91, 183, 73, 0.6); } 50% { box-shadow: 0 0 0 8px rgba(91, 183, 73, 0); } }
  .gps-pulse { animation: gps-pulse 2s infinite; }
  
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  .ai-shimmer { background: linear-gradient(110deg, transparent 30%, rgba(91, 183, 73, 0.1) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 4s infinite; }
  
  .btn-press { transition: transform 0.1s ease, box-shadow 0.2s; }
  .btn-press:active { transform: scale(0.98); }
  
  .map-bg {
    background-color: #EEF2EA;
    background-image: 
      linear-gradient(90deg, rgba(91, 183, 73, 0.08) 1px, transparent 1px),
      linear-gradient(rgba(91, 183, 73, 0.08) 1px, transparent 1px),
      radial-gradient(circle at 30% 40%, rgba(91, 183, 73, 0.15) 0%, transparent 35%),
      radial-gradient(circle at 70% 70%, rgba(20, 42, 90, 0.1) 0%, transparent 40%),
      radial-gradient(circle at 15% 80%, rgba(91, 183, 73, 0.1) 0%, transparent 30%);
    background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%, 100% 100%;
  }
  
  .card-hover { transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; }
  .card-hover:hover { border-color: rgba(20, 42, 90, 0.2); box-shadow: 0 4px 20px -10px rgba(20, 42, 90, 0.1); }
  
  .nav-item-active { background: linear-gradient(90deg, rgba(91, 183, 73, 0.12) 0%, transparent 100%); border-left: 3px solid #5BB749; }
  
  .pulse-dot { position: relative; }
  .pulse-dot::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; background: inherit; opacity: 0.4; animation: pulse-ring 1.5s ease-out infinite; }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(2.5); opacity: 0; } }
  
  .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  
  @keyframes slide-in-right { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .slide-in-right { animation: slide-in-right 0.3s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .fade-in { animation: fade-in 0.2s ease forwards; }
  
  @keyframes slide-in-left { from { transform: translateX(-100%); } to { transform: translateX(0); } }
  .slide-in-left { animation: slide-in-left 0.3s cubic-bezier(0.32, 0.72, 0, 1); }
  
  @keyframes slide-out-up { from { opacity: 1; transform: translateY(0); max-height: 200px; } to { opacity: 0; transform: translateY(-20px); max-height: 0; padding: 0; } }
  .slide-out-up { animation: slide-out-up 0.4s ease forwards; overflow: hidden; }
  
  @keyframes toast-in { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toast-out { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100%); } }
  .toast-in { animation: toast-in 0.3s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  .toast-out { animation: toast-out 0.3s ease forwards; }
  
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  
  .sparkline path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  
  input:focus, button:focus { outline: none; }
  .input-field:focus { border-color: #5BB749; box-shadow: 0 0 0 3px rgba(91, 183, 73, 0.15); }

// ===== SIMPLIFIED NIGERIA MAP (SVG) =====
const NigeriaMap = ({ regions, onRegionClick, division = 'all', height = 320 }) => {
  // Approximate Nigeria region shapes - stylized but recognizable
  const regionPaths = {
    NW: 'M 50 60 L 240 50 L 270 130 L 220 180 L 80 180 L 40 130 Z',
    NE: 'M 240 50 L 480 60 L 500 180 L 380 210 L 270 130 Z',
    NC: 'M 80 180 L 220 180 L 270 130 L 380 210 L 410 290 L 200 310 L 80 280 Z',
    SW: 'M 80 280 L 200 310 L 220 380 L 90 410 L 50 350 Z',
    SE: 'M 280 320 L 410 290 L 430 360 L 320 390 Z',
    SS: 'M 220 380 L 320 390 L 430 360 L 460 410 L 240 440 Z',
  };
  
  const regionCenters = {
    NW: [140, 115], NE: [380, 130], NC: [240, 245],
    SW: [130, 350], SE: [365, 345], SS: [340, 405],
  };
  
  return (
    <svg viewBox="0 0 540 460" style={{ width:'100%', maxHeight: height }} preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="mapGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" />
        </filter>
      </defs>
      
      {/* Division highlight backgrounds */}
      {(division === 'south' || division === 'all') && (
        <path d="M 30 270 L 220 270 L 470 270 L 480 460 L 30 460 Z" fill="rgba(244, 63, 94, 0.04)" />
      )}
      {(division === 'north' || division === 'all') && (
        <path d="M 30 40 L 510 40 L 510 270 L 30 270 Z" fill="rgba(99, 102, 241, 0.04)" />
      )}
      
      {NIGERIA_REGIONS.map(r => {
        const data = regions?.find(x => x.code === r.code);
        const intensity = data?.intensity || 0.3;
        const isInScope = division === 'all' || r.div === division;
        const color = r.div === 'south' ? '244, 63, 94' : '99, 102, 241';
        const [cx, cy] = regionCenters[r.code];
        
        return (
          <g key={r.code} onClick={() => onRegionClick && onRegionClick(r)} style={{ cursor: onRegionClick ? 'pointer' : 'default' }}>
            <path 
              d={regionPaths[r.code]} 
              fill={isInScope ? `rgba(${color}, ${0.3 + intensity * 0.5})` : 'rgba(220, 227, 242, 0.4)'}
              stroke={isInScope ? `rgba(${color}, 0.9)` : 'rgba(143, 165, 209, 0.5)'}
              strokeWidth="2"
              className="transition-all"
            />
            {/* Region label */}
            <g transform={`translate(${cx}, ${cy})`}>
              <rect x="-22" y="-12" width="44" height="22" rx="4" fill="white" stroke={isInScope ? `rgba(${color}, 0.4)` : 'rgba(220, 227, 242, 0.6)'} strokeWidth="1" />
              <text textAnchor="middle" y="3" fontSize="10" fontWeight="700" fill={isInScope ? `rgba(${color}, 1)` : '#8FA5D1'} fontFamily="Sora, sans-serif">{r.code}</text>
            </g>
            {data && (
              <g transform={`translate(${cx}, ${cy + 22})`}>
                <text textAnchor="middle" fontSize="9" fontWeight="700" fill="#0A1830" fontFamily="JetBrains Mono, monospace">{data.label || data.intensity * 100 + '%'}</text>
              </g>
            )}
          </g>
        );
      })}
    </svg>
  );
};

// ===== ROLE SWITCHER (demo mode) =====
const RoleSwitcher = ({ currentRole, onSwitchRole }) => {
  const [open, setOpen] = useState(false);
  const dropdownRef = useRef(null);
  const current = PERSONAS[currentRole];
  const currentColors = PERSONA_COLOR_MAP[current.tagColor];
  
  useEffect(() => {
    const handleClickOutside = (e) => {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setOpen(false);
      }
    };
    if (open) document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, [open]);
  
  const groupedRoles = useMemo(() => {
    const groups = {};
    Object.entries(PERSONAS).forEach(([key, p]) => {
      if (!groups[p.category]) groups[p.category] = [];
      groups[p.category].push({ key, ...p });
    });
    return groups;
  }, []);
  
  return (
    <div className="relative" ref={dropdownRef}>
      <button onClick={() => setOpen(!open)} 
        className={`flex items-center gap-1.5 sm:gap-2 pl-1 sm:pl-1.5 pr-1.5 sm:pr-2.5 py-1 sm:py-1.5 rounded-lg border-2 ${currentColors.border} bg-white hover:bg-paper transition-colors btn-press group`}>
        <span className="hidden md:inline-flex items-center px-1.5 py-0.5 rounded bg-leaf-500 text-white text-[9px] font-bold tracking-wider uppercase">Demo</span>
        <div className={`w-7 h-7 rounded-md ${currentColors.avBg} flex items-center justify-center text-white text-[10px] font-display font-bold flex-shrink-0`}>
          {current.initials}
        </div>
        <div className="hidden lg:block text-left">
          <p className="font-display font-bold text-xs text-ink leading-tight">{current.name.split(' ')[0]}</p>
          <p className={`text-[9px] font-bold ${currentColors.tagText} leading-tight`}>{current.tag}</p>
        </div>
        <Icon name="chevronDown" size={12} className={`text-navy-400 transition-transform flex-shrink-0 ${open ? 'rotate-180' : ''}`} />
      </button>
      
      {open && (
        <div className="absolute top-full right-0 mt-2 w-[calc(100vw-1.5rem)] sm:w-80 max-w-sm rounded-2xl bg-white border border-navy-100 shadow-2xl overflow-hidden z-50 fade-in" style={{ animation: 'fade-up 0.2s ease forwards' }}>
          <div className="px-4 py-3 border-b border-navy-100 bg-paper flex items-center gap-2">
            <Icon name="users" size={14} className="text-leaf-700" />
            <div className="flex-1">
              <p className="font-display font-bold text-sm text-ink">Switch Demo Role</p>
              <p className="text-[10px] text-navy-500">See FieldForce through any role's lens</p>
            </div>
            <button onClick={() => setOpen(false)} className="text-navy-400 hover:text-navy-700">
              <Icon name="x" size={14} />
            </button>
          </div>
          
          <div className="max-h-[480px] overflow-y-auto p-2">
            {Object.entries(groupedRoles).map(([category, roles]) => (
              <div key={category} className="mb-1">
                <p className="px-3 pt-2 pb-1 text-[9px] font-bold text-navy-400 tracking-wider uppercase">{category}</p>
                {roles.map(p => {
                  const c = PERSONA_COLOR_MAP[p.tagColor];
                  const isActive = p.key === currentRole;
                  return (
                    <button key={p.key} onClick={() => { onSwitchRole(p.key); setOpen(false); }}
                      className={`w-full p-2.5 rounded-lg flex items-center gap-2.5 text-left transition-all btn-press ${
                        isActive ? `bg-paper border-2 ${c.border}` : `border-2 border-transparent ${c.hover} hover:bg-paper`
                      }`}>
                      <div className={`w-10 h-10 rounded-lg ${c.avBg} flex items-center justify-center text-white text-xs font-display font-bold flex-shrink-0`}>
                        {p.initials}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <p className="font-display font-bold text-sm text-ink truncate">{p.name}</p>
                          <span className={`px-1.5 py-0.5 rounded ${c.tagBg} ${c.tagText} text-[9px] font-bold flex-shrink-0`}>{p.tag}</span>
                          {isActive && <span className="px-1.5 py-0.5 rounded bg-leaf-100 text-leaf-700 text-[9px] font-bold">ACTIVE</span>}
                        </div>
                        <p className="text-[10px] text-navy-500 truncate">{p.desc}</p>
                      </div>
                      {isActive ? (
                        <Icon name="check" size={14} className="text-leaf-600 flex-shrink-0" strokeWidth={3} />
                      ) : (
                        <Icon name="arrowRight" size={12} className={`${c.tagText} flex-shrink-0`} />
                      )}
                    </button>
                  );
                })}
              </div>
            ))}
          </div>
          
          <div className="px-4 py-2.5 border-t border-navy-100 bg-paper">
            <p className="text-[10px] text-navy-500 leading-relaxed">
              <span className="font-bold">💡 Pro tip:</span> Order submitted as Rep → Approve as RSM. Submit CME as Rep → Approve as PM. All data flows live between roles.
            </p>
          </div>
        </div>
      )}
    </div>
  );
};

const ApprovalModal = ({ item, onClose, onApprove, onReject }) => {
  const [step, setStep] = useState('review');
  const [rejectReason, setRejectReason] = useState('');
  
  if (!item) return null;
  
  const handleApprove = () => {
    setStep('approving');
    setTimeout(() => {
      setStep('approved');
      setTimeout(() => {
        onApprove(item.id);
        onClose();
      }, 1400);
    }, 800);
  };
  
  const handleReject = () => {
    if (!rejectReason.trim()) {
      setStep('reject');
      return;

    setStep('rejecting');

      onReject(item.id, rejectReason);
      onClose();

  const [form, setForm] = useState({ rep: 'Adaeze Okafor', territory: 'Lekki Cluster', visitsShadowed: 4, notes: '' });

  const reps = ['Adaeze Okafor', 'Chinedu Eze', 'Tope Adeola', 'Bayo Salami', 'Yetunde Cole'];

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.notes) return;
    onSaveAccompaniment(form);
    setForm({ rep: 'Adaeze Okafor', territory: 'Lekki Cluster', visitsShadowed: 4, notes: '' });
    setShowForm(false);
  };

  return (
    <div className="p-4 sm:p-6 lg:p-8 space-y-6 max-w-[1600px] mx-auto animate-fade-in">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-3">

            <button onClick={onBack} className="w-8 h-8 rounded-lg bg-white border border-navy-100 flex items-center justify-center btn-press">
              <Icon name="chevronLeft" size={16} className="text-navy-700" />
            </button>
          )}
          <div>
            <p className="text-[10px] font-bold text-navy-400 tracking-wider uppercase">Coaching & Mentorship</p>
            <h2 className="font-display text-xl sm:text-2xl font-bold text-ink">Field Shadow Logs</h2>
          </div>
        </div>
        <button onClick={() => setShowForm(!showForm)} className="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-xs font-bold btn-press flex items-center gap-1.5 shadow-lg shadow-violet-600/20">
          <Icon name={showForm ? 'x' : 'plus'} size={14} /> {showForm ? 'Cancel Log' : 'Log Accompaniment'}
        </button>
      </div>

      {showForm && (
        <form onSubmit={handleSubmit} className="fade-up rounded-2xl bg-white border border-navy-100 p-5 sm:p-6 max-w-xl mx-auto space-y-4 shadow-xl">

            <div>

              <input type="number" min={1} value={form.visitsShadowed} onChange={e => setForm({...form, visitsShadowed: parseInt(e.target.value) || 1})}

                <Icon name="check" size={8} strokeWidth={3} /> SYNCED
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

              <div className="mt-4 flex gap-2">
                <button className="flex-1 py-2.5 rounded-lg border border-navy-200 text-sm font-bold text-navy-700">Save Draft</button>
                <button onClick={() => { addToast({ type:'success', title:'Report pushed to BM', msg:'BM Cestra · Week 19 summary' }); setView('asm-area'); }} className="flex-1 py-2.5 rounded-lg bg-sky-500 text-white text-sm font-bold flex items-center justify-center gap-1.5">
                  <Icon name="send" size={14} /> Push to BM
                </button>
              </div>
            </div>
          </div>
        );
        default: return <ASMDashboard onNavigate={setView} />;
      }
    }
    
    // FSM ROUTES
    if (isFSM) {
      switch (view) {
        case 'fsm-trade': return <FSMDashboard onNavigate={setView} />;
        case 'fsm-distributors': return <FSMDistributorsView />;
        case 'activity': return <FieldActivityView searchQuery={searchQuery} />;
        case 'orders': return <OrdersView orders={orders} onOpenApproval={openOrderApproval} onApprove={approveItem} searchQuery={searchQuery} />;
        case 'insights': return <InsightsView />;
        default: return <FSMDashboard onNavigate={setView} />;
      }
    }
    
    // PM ROUTES
    if (isPM) {
      switch (view) {
        case 'pm-portfolio': return <PMDashboard onNavigate={setView} clinicalMeetings={clinicalMeetings} customerInventory={customerInventory} accompaniments={accompaniments} />;
        case 'pm-materials': return <PMMaterialsView onPushMaterial={handlePushMaterial} />;
        case 'pm-clinical': return <PMClinicalView clinicalMeetings={clinicalMeetings} onApproveCM={handlePMApproveCM} onRejectCM={rejectCM} />;
        case 'pm-inventory': return <CustomerInventoryView customerInventory={customerInventory} onBack={() => setView('pm-portfolio')} isPM={true} />;
        case 'pm-directives': return <PMDirectivesView directives={directives} onPushDirective={handlePushDirective} onBack={() => setView('pm-portfolio')} />;
        case 'pm-field': return <PMFieldView accompaniments={accompaniments} onSaveAccompaniment={handleSaveAccompaniment} onBack={() => setView('pm-portfolio')} />;
        case 'insights': return <InsightsView />;
        default: return <PMDashboard onNavigate={setView} clinicalMeetings={clinicalMeetings} customerInventory={customerInventory} accompaniments={accompaniments} />;
      }
    }
    
    // MM ROUTES
    if (isMM) {
      switch (view) {
        case 'mm-marketing': return <MMDashboard onNavigate={setView} contentApprovals={contentApprovals} clinicalMeetings={clinicalMeetings} />;
        case 'mm-content': return <MMContentApprovalsView contentApprovals={contentApprovals} onApproveContent={handleApproveContent} onRejectContent={handleRejectContent} />;
        case 'mm-cme': return <MMCmeView clinicalMeetings={clinicalMeetings} onApprove={handleMMApproveCM} onReject={rejectCM} />;
        case 'insights': return <InsightsView />;
        default: return <MMDashboard onNavigate={setView} contentApprovals={contentApprovals} clinicalMeetings={clinicalMeetings} />;
      }
    }
    
    // DM ROUTES
    if (isDM) {
      switch (view) {
        case 'dm-division': return <DMDashboard onNavigate={setView} approvals={approvals} />;
        case 'dm-regions': return <DMDashboard onNavigate={setView} approvals={approvals} />;
        case 'dm-escalated': return <DMEscalatedView onApprove={(id) => addToast({ type:'success', title:'Escalation approved', msg:'Pushed back to RSM · SOA syncing' })} onReject={() => {}} />;
        case 'insights': return <InsightsView />;
        case 'dm-push': return (
          <div className="p-8 max-w-2xl mx-auto">
            <div className="rounded-2xl bg-white border border-navy-100 p-6 fade-up">
              <h3 className="font-display text-xl font-bold text-ink">Push Divisional Report to NSM</h3>
              <p className="text-sm text-navy-500 mt-1 mb-5">Weekly division summary · Auto-includes 3 regions' KPIs</p>
              <textarea rows={8} defaultValue="Week 19 — South Division: Pipeline up 18% MoM to ₦128M. SW leading at 92% attainment, SE under-indexing on Coflin (recommend PM Akande engagement). 2 escalated discounts approved this week. Distributor stockout risk in Onitsha resolved via priority push."
                className="input-field w-full p-3 rounded-xl bg-paper border border-navy-200 text-sm resize-none" />
              <div className="mt-4 flex gap-2">
                <button className="flex-1 py-2.5 rounded-lg border border-navy-200 text-sm font-bold text-navy-700">Save Draft</button>
                <button onClick={() => { addToast({ type:'success', title:'Pushed to NSM', msg:'Bayo Ogunlana · Week 19 division summary' }); setView('dm-division'); }} className="flex-1 py-2.5 rounded-lg bg-rose-500 text-white text-sm font-bold flex items-center justify-center gap-1.5">
                  <Icon name="send" size={14} /> Push to NSM
                </button>
              </div>
            </div>
          </div>
        );
        default: return <DMDashboard onNavigate={setView} approvals={approvals} />;
      }
    }
    
    // NSM ROUTES
    if (isNSM) {
      switch (view) {
        case 'nsm-national': return <NSMDashboard onNavigate={setView} />;
        case 'nsm-divisions': return <NSMDashboard onNavigate={setView} />;
        case 'nsm-forecast': return <InsightsView />;
        case 'nsm-directive': return <NSMDirectiveView onSendDirective={handleSendDirective} />;
        case 'insights': return <InsightsView />;
        default: return <NSMDashboard onNavigate={setView} />;
      }
    }
    
    // MANAGER ROUTES (RSM/default)
    switch (view) {
      case 'dashboard': return <DashboardView approvals={approvals} onOpenApproval={setApprovalModalItem} onApprove={approveItem} onReject={rejectItem} dashboardStats={dashboardStats} />;
      case 'activity': return <FieldActivityView searchQuery={searchQuery} />;
      case 'orders': return <OrdersView orders={orders} onOpenApproval={openOrderApproval} onApprove={approveItem} searchQuery={searchQuery} />;
      case 'hcps': return <HCPsView searchQuery={searchQuery} />;
      case 'insights': return <InsightsView />;
      case 'clinical': return <ClinicalView clinicalMeetings={clinicalMeetings} onApproveCM={approveCM} onRejectCM={rejectCM} />;
      case 'reports': return <ReportsView />;
      case 'itineraries': return <RSMItinerariesView 
        itinerariesPending={itinerariesPending} 
        adjustmentsPending={adjustmentsPending}
        onApproveItinerary={handleApproveItinerary}
        onRejectItinerary={handleRejectItinerary}
        onApproveAdjustment={handleApproveAdjustment}
        onRejectAdjustment={handleRejectAdjustment} />;
      default: return <DashboardView approvals={approvals} onOpenApproval={setApprovalModalItem} onApprove={approveItem} onReject={rejectItem} dashboardStats={dashboardStats} />;
    }
  };
  
  if (!isAuthenticated) {
    return (
      <>
        <LoginScreen onLogin={handleLogin} />
        <ToastContainer toasts={toasts} onDismiss={dismissToast} />
      </>
    );
  }
  
  // Build sidebar props based on role
  // Bottom nav configs (mobile only - 5 most important items per role)
  const bottomNavMap = {
    rep: { items: [
      { k: 'rep-day', i: 'dashboard', l: 'Day' },
      { k: 'rep-plan', i: 'map', l: 'Plan', badge: 5 },
      { k: 'rep-visit', i: 'location', l: 'Visit', live: !!activeVisit },
      { k: 'rep-orders', i: 'cart', l: 'Orders' },
      { k: 'rep-coach', i: 'sparkles', l: 'Coach' },
    ], color: 'leaf' },
    manager: { items: [
      { k: 'dashboard', i: 'dashboard', l: 'Home' },
      { k: 'itineraries', i: 'calendar', l: 'Plans', badge: itinerariesPending.length + adjustmentsPending.length },
      { k: 'orders', i: 'cart', l: 'Orders', badge: approvals.length },
      { k: 'activity', i: 'activity', l: 'Field' },
      { k: 'insights', i: 'sparkles', l: 'AI' },
    ], color: 'navy' },
    asm: { items: [
      { k: 'asm-area', i: 'dashboard', l: 'Area' },
      { k: 'asm-team', i: 'users', l: 'Team', badge: 1 },
      { k: 'asm-log', i: 'activity', l: 'Log' },
      { k: 'orders', i: 'cart', l: 'Orders' },
      { k: 'asm-pushup', i: 'send', l: 'Push' },
    ], color: 'sky' },
    fsm: { items: [
      { k: 'fsm-trade', i: 'dashboard', l: 'Trade' },
      { k: 'fsm-distributors', i: 'package', l: 'Dist.', badge: 2 },
      { k: 'orders', i: 'cart', l: 'Orders' },
      { k: 'activity', i: 'activity', l: 'Reps' },
      { k: 'insights', i: 'sparkles', l: 'AI' },
    ], color: 'amber' },
    pm: { items: [
      { k: 'pm-portfolio', i: 'pill', l: 'Brand' },
      { k: 'pm-materials', i: 'file', l: 'Materials' },
      { k: 'pm-clinical', i: 'flask', l: 'CMEs', badge: clinicalMeetings.filter(c => c.s === 'pm-review').length },
      { k: 'pm-directives', i: 'send', l: 'Directives' },
      { k: 'pm-inventory', i: 'package', l: 'Inventory' },
    ], color: 'violet' },
    mm: { items: [
      { k: 'mm-marketing', i: 'dashboard', l: 'Brand' },
      { k: 'mm-content', i: 'file', l: 'Content', badge: contentApprovals.filter(c => c.status === 'pending').length },
      { k: 'mm-cme', i: 'flask', l: 'CMEs', badge: clinicalMeetings.filter(c => c.s === 'hom-review').length },
      { k: 'insights', i: 'sparkles', l: 'AI' },
    ], color: 'fuchsia' },
    dm: { items: [
      { k: 'dm-division', i: 'dashboard', l: 'Division' },
      { k: 'dm-regions', i: 'map', l: 'Regions' },
      { k: 'dm-escalated', i: 'alert', l: 'Escalated', badge: 2 },
      { k: 'insights', i: 'sparkles', l: 'AI' },
      { k: 'dm-push', i: 'send', l: 'Push' },
    ], color: 'rose' },
    nsm: { items: [
      { k: 'nsm-national', i: 'dashboard', l: 'National' },
      { k: 'nsm-divisions', i: 'layers', l: 'Divisions' },
      { k: 'nsm-forecast', i: 'trending', l: 'Forecast' },
      { k: 'insights', i: 'sparkles', l: 'AI' },
      { k: 'nsm-directive', i: 'send', l: 'Push' },
    ], color: 'indigo' },
  };
  
  const currentBottomNav = bottomNavMap[user?.roleType] || bottomNavMap.manager;
  
  const renderSidebar = (isMobile, closeFn) => {
    const common = { 
      active: view, onNavigate: setView, isMobile, onClose: closeFn, 
      onLogout: handleLogout, user,
      collapsed: !isMobile && sidebarCollapsed,
      onToggleCollapse: () => setSidebarCollapsed(c => !c),
    };
    if (isRep) return <RepSidebar {...common} activeVisit={activeVisit} />;
    if (isASM) return <RoleSidebar {...common} roleType="asm" navItems={asmNav} statusPill={{ label:'Area Active', value:'Lekki/V.I. · 4 reps live' }} />;
    if (isFSM) return <RoleSidebar {...common} roleType="fsm" navItems={fsmNav} statusPill={{ label:'Trade Channel', value:'South-West · 12 distributors' }} />;
    if (isPM) return <RoleSidebar {...common} roleType="pm" navItems={pmNav} statusPill={{ label:'Portfolio Active', value:'Respiratory Care' }} />;
    if (isMM) return <RoleSidebar {...common} roleType="mm" navItems={mmNav} statusPill={{ label:'Marketing · National', value:'Institution · 4 portfolios' }} />;
    if (isDM) return <RoleSidebar {...common} roleType="dm" navItems={dmNav} statusPill={{ label:'Division Active', value:'South · 3 regions · 67 reps' }} />;
    if (isNSM) return <RoleSidebar {...common} roleType="nsm" navItems={nsmNav} statusPill={{ label:'National', value:'Nigeria · 2 div · 6 regions' }} />;
    return <Sidebar {...common} approvalsCount={approvals.length} itinerariesBadge={itinerariesPending.length + adjustmentsPending.length} />;
  };
  
  return (
    <div className="flex flex-row-reverse h-screen overflow-hidden">
      {renderSidebar(false)}
      
      <div className="flex-1 flex flex-col overflow-hidden min-w-0">
        <TopBar 
          onMenuClick={() => setSidebarOpen(true)} 
          title={viewMeta[view]?.t || 'FieldForce'} 
          subtitle={viewMeta[view]?.s || ''}
          searchQuery={searchQuery}
          setSearchQuery={setSearchQuery}
          currentRole={user?.currentRole}
          onSwitchRole={handleSwitchRole} />
        <main className="flex-1 overflow-y-auto bg-paper pb-20 md:pb-0">
          {renderView()}
        </main>
        {currentBottomNav && (
          <BottomNav 
            items={currentBottomNav.items} 
            active={view} 
            onNavigate={setView} 
            accentColor={currentBottomNav.color} />
        )}
      </div>
      
      {sidebarOpen && (
        <>
          <div className="md:hidden fixed inset-0 z-40 fade-in" 
            style={{ background: 'rgba(10, 24, 48, 0.5)' }}
            onClick={() => setSidebarOpen(false)}></div>
          {renderSidebar(true, () => setSidebarOpen(false))}
        </>
      )}
      
      {approvalModalItem && (
        <ApprovalModal 
          item={approvalModalItem} 
          onClose={() => setApprovalModalItem(null)}
          onApprove={handleApprovalModalApprove}
          onReject={handleApprovalModalReject} />
      )}
      
      <ToastContainer toasts={toasts} onDismiss={dismissToast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
